<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>캐릭터 내용 입력 도구</title>
<style>
  :root {
    --bg: #14141c;
    --bg-elevated: #1e1e29;
    --bg-field: #252531;
    --text: #f5f5f7;
    --text-muted: #9a9aab;
    --accent: #7c6cf3;
    --border: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", sans-serif;
  }
  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 6px;
  }
  .sub {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0 0 28px;
    line-height: 1.5;
  }
  .card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex: none;
    border: 1px solid var(--border);
  }
  .card-head h2 {
    font-size: 15px;
    margin: 0;
    color: var(--text-muted);
    font-weight: 600;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin: 14px 0 6px;
  }
  label:first-of-type {
    margin-top: 0;
  }
  input[type="text"], textarea {
    width: 100%;
    background: var(--bg-field);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .feature-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .feature-row input {
    flex: 1;
  }
  .actions {
    position: sticky;
    bottom: 0;
    display: flex;
    gap: 10px;
    padding: 16px 0;
    background: linear-gradient(to top, var(--bg) 60%, transparent);
  }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    border-radius: 12px;
    border: none;
    padding: 14px 18px;
    cursor: pointer;
  }
  .btn-primary {
    flex: 1;
    background: var(--accent);
    color: white;
  }
  .btn-secondary {
    background: var(--bg-elevated);
    color: var(--text);
    border: 1px solid var(--border);
  }
  details {
    margin-top: 20px;
  }
  summary {
    cursor: pointer;
    color: var(--text-muted);
    font-size: 13px;
  }
  textarea#output {
    width: 100%;
    height: 260px;
    margin-top: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    white-space: pre;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .toast.show {
    opacity: 1;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>캐릭터 내용 입력 도구</h1>
  <p class="sub">
    멤버 5명의 이름/소개/특징을 채운 뒤 아래 <b>characters.js 다운로드</b> 버튼을 누르면
    파일이 저장됩니다. 그 파일을 GitHub 저장소 최상위(루트)에 그대로 업로드해서
    기존 characters.js를 덮어쓰면 앱에 바로 반영됩니다.
  </p>

  <div id="cards"></div>

  <div class="actions">
    <button class="btn-secondary" id="btn-copy">JS 복사</button>
    <button class="btn-primary" id="btn-download">characters.js 다운로드</button>
  </div>

  <details>
    <summary>생성된 코드 미리보기</summary>
    <textarea id="output" readonly></textarea>
  </details>
</div>

<div class="toast" id="toast"></div>

<script src="characters.js"></script>
<script>
  const cardsEl = document.getElementById("cards");
  const outputEl = document.getElementById("output");
  const toastEl = document.getElementById("toast");

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 1600);
  }

  function cardHtml(c, index) {
    const features = c.features && c.features.length ? c.features : ["", "", ""];
    while (features.length < 3) features.push("");
    return `
      <div class="card" data-index="${index}">
        <div class="card-head">
          <div class="swatch" style="background:${c.color || "#7C6CF3"}"></div>
          <h2>멤버 ${index + 1}</h2>
        </div>

        <label>이름</label>
        <input type="text" class="f-name" value="${escapeAttr(c.name || "")}" placeholder="예) 루나" />

        <label>한줄 소개 (tagline)</label>
        <input type="text" class="f-tagline" value="${escapeAttr(c.tagline || "")}" placeholder="예) 달빛 아래의 몽상가" />

        <div class="row2">
          <div>
            <label>나이</label>
            <input type="text" class="f-age" value="${escapeAttr(c.age || "")}" placeholder="예) 17세" />
          </div>
          <div>
            <label>역할</label>
            <input type="text" class="f-role" value="${escapeAttr(c.role || "")}" placeholder="예) 리더" />
          </div>
        </div>

        <div class="row2">
          <div>
            <label>색상 (hex)</label>
            <input type="text" class="f-color" value="${escapeAttr(c.color || "#7C6CF3")}" placeholder="#7C6CF3" />
          </div>
          <div>
            <label>이모지 (사진 없을 때 대체)</label>
            <input type="text" class="f-emoji" value="${escapeAttr(c.emoji || "")}" placeholder="🌙" />
          </div>
        </div>

        <label>사진 파일명</label>
        <input type="text" class="f-image" value="${escapeAttr(c.image || "")}" placeholder="예) character-1.png" />

        <label>특징 (3가지)</label>
        <div class="feature-row"><input type="text" class="f-feature" value="${escapeAttr(features[0])}" /></div>
        <div class="feature-row"><input type="text" class="f-feature" value="${escapeAttr(features[1])}" /></div>
        <div class="feature-row"><input type="text" class="f-feature" value="${escapeAttr(features[2])}" /></div>

        <label>소개 (description)</label>
        <textarea class="f-description" rows="3">${escapeHtml(c.description || "")}</textarea>
      </div>
    `;
  }

  function escapeAttr(s) {
    return String(s).replace(/"/g, "&quot;");
  }
  function escapeHtml(s) {
    return String(s).replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function render() {
    const data = (typeof CHARACTERS !== "undefined" && CHARACTERS.length) ? CHARACTERS : [
      {}, {}, {}, {}, {}
    ];
    cardsEl.innerHTML = data.map(cardHtml).join("");
    updateOutput();
    cardsEl.querySelectorAll("input, textarea").forEach((el) => {
      el.addEventListener("input", updateOutput);
    });
  }

  function readCards() {
    return Array.from(cardsEl.querySelectorAll(".card")).map((card, i) => {
      const val = (sel) => card.querySelector(sel).value.trim();
      const features = Array.from(card.querySelectorAll(".f-feature"))
        .map((el) => el.value.trim())
        .filter(Boolean);
      return {
        id: i + 1,
        name: val(".f-name"),
        tagline: val(".f-tagline"),
        image: val(".f-image") || null,
        color: val(".f-color") || "#7C6CF3",
        emoji: val(".f-emoji"),
        age: val(".f-age"),
        role: val(".f-role"),
        features,
        description: card.querySelector(".f-description").value.trim(),
      };
    });
  }

  function toJsSource(list) {
    const body = list.map((c) => `  {
    id: ${c.id},
    name: ${JSON.stringify(c.name)},
    tagline: ${JSON.stringify(c.tagline)},
    image: ${c.image ? JSON.stringify(c.image) : "null"},
    color: ${JSON.stringify(c.color)},
    emoji: ${JSON.stringify(c.emoji)},
    age: ${JSON.stringify(c.age)},
    role: ${JSON.stringify(c.role)},
    features: [
${c.features.map((f) => `      ${JSON.stringify(f)},`).join("\n")}
    ],
    description: ${JSON.stringify(c.description)},
  }`).join(",\n");

    return `// 캐릭터 소개 데이터
// 여기 내용만 바꾸면 앱에 바로 반영됩니다.
// image: 캐릭터 프로필 사진 경로. 아직 없으면 null로 두면
// 색상 배경 + 이모지로 자동 대체됩니다.
const CHARACTERS = [
${body},
];
`;
  }

  function updateOutput() {
    outputEl.value = toJsSource(readCards());
  }

  document.getElementById("btn-copy").addEventListener("click", async () => {
    updateOutput();
    try {
      await navigator.clipboard.writeText(outputEl.value);
      showToast("복사했어요");
    } catch {
      outputEl.select();
      document.execCommand("copy");
      showToast("복사했어요");
    }
  });

  document.getElementById("btn-download").addEventListener("click", () => {
    updateOutput();
    const blob = new Blob([outputEl.value], { type: "text/javascript" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "characters.js";
    a.click();
    URL.revokeObjectURL(url);
    showToast("다운로드했어요");
  });

  render();
</script>
</body>
</html>
